name: mail-agent

on:
  schedule:
    # 10분마다 (UTC 기준, GitHub 사정에 따라 몇 분 늦게 시작될 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행

# 이전 실행이 아직 끝나지 않았으면 다음 실행은 기다린다 (같은 메일 중복 발송 방지)
concurrency:
  group: mail-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 실행마다 새 머신이라 "어디까지 읽었는지(state.json)"를 Actions 캐시에 보관한다.
      # 들어 있는 건 UID 숫자 두 개뿐이라 메일 내용은 저장되지 않는다.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: mail-agent-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mail-agent-state-

      # 개인정보(주소·키워드·비밀번호)는 전부 secrets 로 넣는다.
      # vars 값은 공개 저장소의 실행 로그에 그대로 보이므로 민감하지 않은 값만 둔다.
      - name: Run agent
        run: python -m mail_agent --once
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SENDER_KEYWORDS: ${{ secrets.SENDER_KEYWORDS }}
          ORGANIZE_FOLDER: ${{ secrets.ORGANIZE_FOLDER }}
          IMAP_HOST: ${{ vars.IMAP_HOST || 'imap.gmail.com' }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_MAILBOX: ${{ vars.IMAP_MAILBOX }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: mail-agent-state-${{ github.run_id }}-${{ github.run_attempt }}
